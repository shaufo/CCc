; 自动测速
custom_proxy_group=♻️ 手动选择`select`.*

;自定义节点
custom_proxy_group=波红多牛`url-test`(波池1|波池2|红杏|多宝|牛逼)`https://www.gstatic.com/generate_204`300,,100
custom_proxy_group=波池机场`url-test`(波池1|波池2)`https://www.gstatic.com/generate_204`300,,100
