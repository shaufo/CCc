custom_proxy_group=台狮自动`url-test`^(?!.*(?:一元|MB|CF)).*(台|台湾|坡|新加坡|狮).*`https://www.gstatic.com/generate_204`300,,100
custom_proxy_group=欧洲自动`url-test`^(?!.*(?:一元|MB|CF)).*(英国|法国|德国|荷兰|瑞士|西班牙|瑞典|土耳其|希腊|挪威).*`https://www.gstatic.com/generate_204`300,,100
