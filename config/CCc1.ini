custom_proxy_group=🚀 节点选择`select`[]🚀 故障转移`[]台狮-手动`[]波红多牛`[]红杏机场`[]多宝机场`[]牛逼机场`[]波池机场`[]稳如老狗`[]一元机场`[]FREE测速`[]香港自动`[]美加自动`[]台狮自动`[]日韩自动`[]欧洲自动`[]中东自动`[]南亚自动`[]♻️ 手动选择`[]DIRECT
